services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marea
      POSTGRES_USER: marea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Exposed on 5434, not Postgres's default 5432, since a machine running
    # this stack often already has its own local Postgres on 5432 (this
    # project's own vitest integration harness included) — for the E2E
    # suite's own Node-side setup (see e2e/scripts/), never read by the app
    # container itself, which still talks to `db` over the internal
    # network regardless of this mapping.
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marea"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fake SMTP server with a web UI to see rendered emails during
  # development — never used in production, where MAIL_DRIVER=smtp points
  # at a real server instead. 1025 is where `app`'s smtp driver connects;
  # 8025 is the inbox at http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  # One-shot: applies migrations, then exits. `app` won't start until this
  # succeeds. Never runs the seed — that stays a command someone types.
  migrate:
    image: marea-migrate:local
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://marea:${POSTGRES_PASSWORD}@db:5432/marea
    depends_on:
      db:
        condition: service_healthy

  # Never depended on by `app` — seeding stays a command someone types
  # (`docker compose run --rm seed`), same rule seed.ts's own doc comment
  # states. Exists in this file at all only so the E2E stack can invoke it
  # without a second compose file.
  seed:
    image: marea-seed:local
    build:
      context: .
      target: seed
    environment:
      DATABASE_URL: postgresql://marea:${POSTGRES_PASSWORD}@db:5432/marea
      # seed.ts refuses to run against a host it can't prove is local
      # (see prisma/seed.ts's assertLocalTarget) — "db" is this project's
      # own service name in a *real* deployment's compose file too, so it
      # can't be trusted as a "this is just CI" signal. This escape hatch
      # is the intended one: an ephemeral CI/E2E database, never a real
      # deployment's environment.
      I_KNOW_WHAT_IM_DOING: "1"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  app:
    image: marea-app:local
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://marea:${POSTGRES_PASSWORD}@db:5432/marea
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      APP_ORIGIN: ${APP_ORIGIN:-}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/media
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      MAIL_DRIVER: smtp
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-notifications@marea.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Marea}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    volumes:
      - media:/data/media
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailhog:
        condition: service_started

  # Fase 3 fills this in once scripts/worker.ts exists: the long-running
  # mode of the same processQueue() that app/api/cron/notifications also
  # calls for serverless deploys.
  # worker:
  #   image: marea-app:local
  #   build:
  #     context: .
  #     target: runner
  #   command: ["node", "scripts/worker.js"]
  #   environment:
  #     DATABASE_URL: postgresql://marea:${POSTGRES_PASSWORD}@db:5432/marea
  #     MAIL_DRIVER: smtp
  #     MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-notifications@marea.local}
  #     MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Marea}
  #     SMTP_HOST: mailhog
  #     SMTP_PORT: 1025
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     migrate:
  #       condition: service_completed_successfully
  #     mailhog:
  #       condition: service_started

volumes:
  pgdata:
  media:
