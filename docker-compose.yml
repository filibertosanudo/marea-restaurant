services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marea
      POSTGRES_USER: marea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Exposed on 5434, not Postgres's default 5432, since a machine running
    # this stack often already has its own local Postgres on 5432 (this
    # project's own vitest integration harness included) — for the E2E
    # suite's own Node-side setup (see e2e/scripts/), never read by the app
    # container itself, which still talks to `db` over the internal
    # network regardless of this mapping.
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marea"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fake SMTP server with a web UI to see rendered emails during
  # development — never used in production, where MAIL_DRIVER=smtp points
  # at a real server instead. 1025 is where `app`'s smtp driver connects;
  # 8025 is the inbox at http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"
      - "8025:8025"

  # One-shot: applies migrations and gives the application roles their
  # passwords, then exits. `app` won't start until this succeeds. Never runs
  # the seed — that stays a command someone types. Runs as the database
  # owner, the only service that does besides `seed`: the running app and
  # worker connect as marea_app / marea_worker, which row level security
  # binds (see docs/DEPLOY.md).
  migrate:
    image: marea-migrate:local
    build:
      context: .
      target: migrate
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx scripts/provision-db-roles.ts"]
    environment:
      DATABASE_URL: postgresql://marea:${POSTGRES_PASSWORD}@db:5432/marea
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # Never depended on by `app` — seeding stays a command someone types
  # (`docker compose run --rm seed`), same rule seed.ts's own doc comment
  # states. Exists in this file at all only so the E2E stack can invoke it
  # without a second compose file.
  seed:
    image: marea-seed:local
    build:
      context: .
      target: seed
    environment:
      DATABASE_URL: postgresql://marea:${POSTGRES_PASSWORD}@db:5432/marea
      # seed.ts refuses to run against a host it can't prove is local
      # (see prisma/seed.ts's assertLocalTarget) — "db" is this project's
      # own service name in a *real* deployment's compose file too, so it
      # can't be trusted as a "this is just CI" signal. This escape hatch
      # is the intended one: an ephemeral CI/E2E database, never a real
      # deployment's environment.
      I_KNOW_WHAT_IM_DOING: "1"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  app:
    image: marea-app:local
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://marea_app:${APP_DB_PASSWORD}@db:5432/marea
      # The notification queue, the realtime sweep and the LISTEN connection.
      WORKER_DATABASE_URL: postgresql://marea_worker:${WORKER_DB_PASSWORD}@db:5432/marea
      BUSINESS_ROOT_DOMAIN: ${BUSINESS_ROOT_DOMAIN:-}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      APP_ORIGIN: ${APP_ORIGIN:-}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /data/media
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      MAIL_DRIVER: smtp
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-notifications@marea.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Marea}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    volumes:
      - media:/data/media
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailhog:
        condition: service_started

  # The notification queue's long-running mode: poll -> send -> sleep,
  # forever. app/api/cron/notifications is the alternative for platforms
  # with no long-running process — both call the same processQueue().
  worker:
    image: marea-worker:local
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://marea_worker:${WORKER_DB_PASSWORD}@db:5432/marea
      AUTH_SECRET: ${AUTH_SECRET}
      MAIL_DRIVER: smtp
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-notifications@marea.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Marea}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      mailhog:
        condition: service_started

  # The scheduled operations image (see the Dockerfile's `ops` stage). Not part
  # of a plain `up`: it is a one-shot command, run by hand or by the scheduler.
  #   docker compose --profile ops run --rm ops
  # Its connection is the OWNER's (pg_dump must see every row past row level
  # security), and nothing else in the stack gets it besides `migrate`. The
  # BACKUP_* names are its own: the script reads no .env and infers nothing
  # from DATABASE_URL. The media volume is read-only here.
  ops:
    image: marea-ops:local
    profiles: ["ops"]
    build:
      context: .
      target: ops
    environment:
      BACKUP_DATABASE_URL: postgresql://marea:${POSTGRES_PASSWORD}@db:5432/marea
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_MEDIA_DIR: /data/media
      BACKUP_MONITOR_URL: ${BACKUP_MONITOR_URL:-}
    volumes:
      - media:/data/media:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
